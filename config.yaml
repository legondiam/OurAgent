server:
  port: 8080

mysql:
  dsn: "root:20050925@tcp(127.0.0.1:3306)/our_agent?charset=utf8mb4&parseTime=True&loc=Local"

qdrant:
  url: "http://localhost:6333"
  collection: "our_agent_chunks"

minio:
  endpoint: "localhost:9000"
  access_key: "${MINIO_ACCESS_KEY}"
  secret_key: "${MINIO_SECRET_KEY}"
  bucket: "our-agent-documents"
  use_ssl: false

llm:
  base_url: "https://dashscope.aliyuncs.com/compatible-mode/v1"
  api_key: "${OPENAI_API_KEY}"
  chat_model: "qwen3.6-plus"
  embedding_model: "text-embedding-v4"

rag:
  chunk_size: 1000
  chunk_overlap: 200
  top_k: 5
  score_threshold: 0.3
  max_context_tokens: 6000
  strict_mode: true
  query_rewrite_enabled: true
  query_rewrite_max_queries: 3
  query_rewrite_include_original: true
  query_rewrite_model_temperature: 0.1
  query_rewrite_hyde_enabled: false
  query_rewrite_step_back_enabled: false
  hybrid_enabled: true
  bm25_enabled: true
  bm25_top_k: 5
  rrf_k: 60

jwt:
  secret: "${JWT_SECRET}"
  expires_hours: 168

search:
  bluge_dir: "storage/bluge"
